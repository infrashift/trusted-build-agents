# Build every image leg, generate evidence, sign it, and push to development/.
#
# ONE WORKFLOW, A MATRIX OVER (image x arch). buildah executes RUN steps, so the
# arm64 legs need a NATIVE arm64 runner -- emulation would make a two-minute Go
# build take twenty and occasionally hang.
name: Build

on:
  pull_request:
    branches: [main]
    paths:
      - versions.json
      - image-contract.json
      - 'Containerfiles/**'
      - 'rootfs/**'
      - 'scripts/**'
      - .github/workflows/build.yml

permissions: {}

concurrency:
  group: build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  matrix-setup:
    name: compute matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      legs: ${{ steps.compute.outputs.legs }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - id: compute
        name: Compute the build matrix
        run: |
          set -euo pipefail
          legs=$(jq -c '[.images | to_entries[] | . as $e | $e.value.arches[] | {image: $e.key, arch: .}]' versions.json)
          echo "legs=${legs}" >> "$GITHUB_OUTPUT"
          echo "$legs" | jq .

  build:
    name: build ${{ matrix.leg.image }} (${{ matrix.leg.arch }})
    needs: matrix-setup
    runs-on: ${{ matrix.leg.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    environment: Build-Actor
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.matrix-setup.outputs.legs) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # THE MATRIX INJECTION GUARD. Matrix values reach shell only through env:
      # and are referenced as "$VAR", never interpolated -- an image name from a
      # crafted versions.json would otherwise be shell. This block is
      # byte-identical in build.yml, review.yml and release.yml; if one copy
      # drifts, that boundary is silently unguarded.
      - name: Guard matrix values
        env:
          LEG_IMAGE: ${{ matrix.leg.image }}
          LEG_ARCH: ${{ matrix.leg.arch }}
        run: |
          set -euo pipefail
          printf '%s' "$LEG_IMAGE" | grep -qE '^[a-z0-9][a-z0-9-]{0,62}$' || { echo "bad image name" >&2; exit 1; }
          printf '%s' "$LEG_ARCH"  | grep -qE '^(amd64|arm64)$'          || { echo "bad arch" >&2; exit 1; }

      # podman is not implicitly present just because buildah is; the contract
      # check and the tool inventory both `podman run' the built image, and a
      # missing runtime there would look like a contract failure rather than a
      # missing tool.
      - name: Install buildah, podman and skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq buildah podman skopeo jq

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        env:
          LEG_IMAGE: ${{ matrix.leg.image }}
          LEG_ARCH: ${{ matrix.leg.arch }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          export TAG="pr-${PR_NUM}-${LEG_ARCH}"
          ref=$(bash scripts/build-leg.sh "$LEG_IMAGE" "$LEG_ARCH" | tail -1)
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          buildah push --digestfile ./pushed-digest.txt "$ref"
          echo "digest=$(cat ./pushed-digest.txt)" >> "$GITHUB_OUTPUT"
          # An OCI directory for the scanners, so syft and grype read exactly the
          # bytes that were pushed rather than pulling them back.
          buildah push "$ref" oci:./oci-image

      # THE CONTRACT, AGAINST THE BUILT BYTES. This is the check that catches a
      # forbidden tool arriving as a transitive dependency, which nothing in the
      # Containerfile or a human review would find.
      - name: Assert the capability contract
        env:
          LEG_IMAGE: ${{ matrix.leg.image }}
          REF: ${{ steps.build.outputs.ref }}
        run: CONTRACT_RUNNER=podman bash scripts/lint-image-contract.sh --image "$LEG_IMAGE" "$REF"

      - name: Generate evidence
        env:
          LEG_IMAGE: ${{ matrix.leg.image }}
          LEG_ARCH: ${{ matrix.leg.arch }}
          REF: ${{ steps.build.outputs.ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source tools.lock
          curl -fsSL "https://raw.githubusercontent.com/anchore/syft/main/install.sh"  | sh -s -- -b /usr/local/bin "$SYFT_VERSION"
          curl -fsSL "https://raw.githubusercontent.com/anchore/grype/main/install.sh" | sh -s -- -b /usr/local/bin "$GRYPE_VERSION"
          syft  oci-dir:./oci-image -o spdx-json=sbom.json
          grype oci-dir:./oci-image -o json > cve-report.json
          # The scan counts the policy reads. `fixable_high' is high severity WITH
          # an upstream fix available -- a high with no fix is not something this
          # build can act on, and gating on it would block every image forever.
          jq -n \
            --argjson c "$(jq '[.matches[] | select(.vulnerability.severity=="Critical")] | length' cve-report.json)" \
            --argjson f "$(jq '[.matches[] | select(.vulnerability.severity=="High" and (.vulnerability.fix.state=="fixed"))] | length' cve-report.json)" \
            '{critical: $c, fixable_high: $f}' > scan-summary.json
          jq -n \
            --arg image "$LEG_IMAGE" --arg arch "$LEG_ARCH" \
            --arg ref "$REF" --arg digest "$DIGEST" \
            --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg commit "$GITHUB_SHA" \
            '{_type: "https://in-toto.io/Statement/v1",
              predicateType: "https://slsa.dev/provenance/v1",
              subject: [{name: $ref, digest: {sha256: ($digest | sub("^sha256:"; ""))}}],
              predicate: {buildDefinition: {buildType: "https://github.com/infrashift/trusted-build-agents/buildah",
                                            externalParameters: {image: $image, arch: $arch, commit: $commit}},
                          runDetails: {builder: {id: $run}}}}' > provenance.json

      - name: Evaluate the policy
        env:
          LEG_IMAGE: ${{ matrix.leg.image }}
          REF: ${{ steps.build.outputs.ref }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source tools.lock
          curl -fsSL -o /tmp/opa "https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64_static"
          sudo install -m 0755 /tmp/opa /usr/local/bin/opa
          # The tool inventory the contract is evaluated against, read from the
          # image rather than from the Containerfile.
          tools=$(podman run --rm --entrypoint /bin/bash "$REF" -c \
            'for t in kaniko-executor envbuilder skopeo cosign registry go gcc git bash; do command -v "$t" >/dev/null && echo "$t"; done' \
            | jq -R . | jq -sc .)
          labels=$(skopeo inspect "docker://${REF}" | jq -c '.Labels // {}')
          jq -n \
            --argjson tools "$tools" \
            --argjson labels "$labels" \
            --argjson scan "$(cat scan-summary.json)" \
            --argjson img "$(jq --arg i "$LEG_IMAGE" '.images[$i]' versions.json)" \
            --argjson contract "$(jq --arg i "$LEG_IMAGE" '.images[$i]' image-contract.json)" \
            '{image: {pool: $img.pool, enforcement: $img.enforcement,
                      runsAsRoot: $img.runtime.runsAsRoot,
                      runsAsRootReason: ($img.runtime.runsAsRootReason // ""),
                      tools: $tools, labels: $labels},
              scan: $scan,
              contract: {required: $contract.required, forbidden: $contract.forbidden}}' > pdp-input.json
          opa eval --format pretty --data .github/pdp/policies.rego --input pdp-input.json 'data.tba.pdp.decision' > decision.txt
          cat decision.txt
          # `observe' still computes, records and publishes every violation and
          # still routes to quarantine. It only stops the pipeline hard-failing.
          if [ "$(jq -r --arg i "$LEG_IMAGE" '.images[$i].enforcement' versions.json)" = enforce ]; then
            opa eval --fail-defined --data .github/pdp/policies.rego --input pdp-input.json \
              'data.tba.pdp.violations[_]' >/dev/null \
              || { echo "::error::policy denied this leg"; exit 1; }
          fi

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign the evidence
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE_URI: ${{ steps.build.outputs.ref }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          for f in sbom.json cve-report.json provenance.json pdp-input.json; do
            cosign sign-blob --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY \
              --output-signature "${f}.sig" "$f"
          done
          # NEVER --replace. It would clobber the amd64 SBOM when writing the
          # arm64 one, and this repo's images are always built per-arch.
          cosign attest --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY \
            --type spdxjson       --predicate sbom.json       "$IMAGE_URI"
          cosign attest --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY \
            --type vuln           --predicate cve-report.json "$IMAGE_URI"
          cosign attest --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY \
            --type slsaprovenance1 --predicate provenance.json "$IMAGE_URI"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-${{ matrix.leg.image }}-${{ matrix.leg.arch }}
          path: |
            sbom.json
            cve-report.json
            provenance.json
            pdp-input.json
            scan-summary.json
            decision.txt
            *.sig

  gate:
    name: build/gate
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      # The aggregate is the required check. Individual matrix legs are
      # deliberately never made required: their names change with versions.json.
      - name: Verdict
        run: |
          set -euo pipefail
          [ "${{ needs.build.result }}" = success ] || exit 1
          echo "all build legs passed"
