# The second actor. Re-evaluates what build.yml produced, with a DIFFERENT key.
#
# THE REVIEW ACTOR DOES NOT TRUST THE BUILD ACTOR. It re-resolves every digest
# LIVE from GHCR and re-reads the image's declared configuration from the
# CHECKED-OUT versions.json -- never from the evidence bundle the build produced.
# That is what makes weakening an image's verification require a CODEOWNERS-
# reviewed commit rather than a workflow edit. Keep it that way.
name: Review

on:
  workflow_run:
    workflows: [Build]
    types: [completed]

permissions: {}

jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment: Review-Actor
    permissions:
      contents: read
      packages: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # The commit the build ran against, not the branch tip: reviewing a
          # different tree than was built is a review of nothing.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: evidence
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq skopeo jq
          # shellcheck disable=SC1091
          source tools.lock
          curl -fsSL -o /tmp/opa "https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64_static"
          sudo install -m 0755 /tmp/opa /usr/local/bin/opa

      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the build actor's signatures
        run: |
          set -euo pipefail
          for sig in evidence/*/*.sig; do
            blob="${sig%.sig}"
            cosign verify-blob --key .github/pdp/public-keys/build.pub \
              --insecure-ignore-tlog=true --signature "$sig" "$blob"
          done
          echo "OK: every evidence blob carries a valid build-actor signature"

      - name: Re-evaluate the policy against live state
        env:
          PR_NUM: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY}/development"
          rc=0
          while read -r image; do
            while read -r arch; do
              ref="${registry}/${image}:pr-${PR_NUM}-${arch}"
              # LIVE from the registry. The build actor's reported digest and
              # labels are evidence of what it claims, not of what is there.
              live=$(skopeo inspect "docker://${ref}")
              labels=$(printf '%s' "$live" | jq -c '.Labels // {}')
              # The scan counts are the one thing that cannot be re-derived here
              # without re-scanning, so they come from the SIGNED bundle -- whose
              # signature was verified in the step above.
              scan=$(jq -c . "evidence/evidence-${image}-${arch}/scan-summary.json")
              tools=$(jq -c '.image.tools' "evidence/evidence-${image}-${arch}/pdp-input.json")
              jq -n \
                --argjson labels "$labels" --argjson scan "$scan" --argjson tools "$tools" \
                --argjson img "$(jq --arg i "$image" '.images[$i]' versions.json)" \
                --argjson contract "$(jq --arg i "$image" '.images[$i]' image-contract.json)" \
                '{image: {pool: $img.pool, enforcement: $img.enforcement,
                          runsAsRoot: $img.runtime.runsAsRoot,
                          runsAsRootReason: ($img.runtime.runsAsRootReason // ""),
                          tools: $tools, labels: $labels},
                  scan: $scan,
                  contract: {required: $contract.required, forbidden: $contract.forbidden}}' > input.json
              route=$(opa eval --format raw --data .github/pdp/policies.rego --input input.json 'data.tba.pdp.route')
              echo "${image}/${arch}: ${route}"
              printf '%s\n' "$route" > "evidence/evidence-${image}-${arch}/route.txt"
              if [ "$route" != '"trusted"' ] && \
                 [ "$(jq -r --arg i "$image" '.images[$i].enforcement' versions.json)" = enforce ]; then
                rc=1
              fi
            done < <(jq -r --arg i "$image" '.images[$i].arches[]' versions.json)
          done < <(jq -r '.images | keys[]' versions.json)
          exit "$rc"

      - name: Countersign the verdict
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          find evidence -name route.txt -print0 | while IFS= read -r -d '' f; do
            cosign sign-blob --yes --tlog-upload=false --key env://COSIGN_PRIVATE_KEY \
              --output-signature "${f}.sig" "$f"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-verdict
          path: evidence/**/route.txt*
