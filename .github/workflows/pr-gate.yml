# Cheap, fast checks on every PR. Runs BEFORE build.yml so a malformed
# versions.json produces a readable error at PR time rather than a cryptic matrix
# failure ten minutes later.
name: PR Gate

on:
  pull_request:
    branches: [main]

# Least privilege by default; each job adds only what it needs.
permissions: {}

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install validation tools
        run: |
          set -euo pipefail
          # shellcheck, opa and gitleaks are not on the runner. Versions come
          # from tools.lock; nothing here installs from `latest'.
          # shellcheck disable=SC1091
          source tools.lock
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck jq
          curl -fsSL -o /tmp/opa "https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64_static"
          sudo install -m 0755 /tmp/opa /usr/local/bin/opa
          # gitleaks is what stands between a private key and a public
          # repository, so it is verified before it runs, not after. Hash first,
          # unpack second: an archive that fails its checksum is never opened.
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          python3 -m pip install --quiet jsonschema

      # A tool that is absent fails `make validate' with "not installed", which
      # is how gitleaks stayed uninstalled here while the step above claimed
      # otherwise. Assert the versions the lock file names are the versions on
      # PATH, so a silent substitution is a failure and not a surprise later.
      - name: Assert the pinned tools are the ones on PATH
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source tools.lock
          for tool in gitleaks opa shellcheck; do
            command -v "$tool" >/dev/null || { echo "error: $tool is not on PATH" >&2; exit 1; }
          done
          got="v$(gitleaks version)"
          [ "$got" = "$GITLEAKS_VERSION" ] || {
            echo "error: gitleaks is $got, tools.lock pins $GITLEAKS_VERSION" >&2; exit 1; }
          got="v$(opa version | awk '/^Version:/ {print $2}')"
          [ "$got" = "$OPA_VERSION" ] || {
            echo "error: opa is $got, tools.lock pins $OPA_VERSION" >&2; exit 1; }
          echo "OK: gitleaks $GITLEAKS_VERSION and opa $OPA_VERSION are on PATH"

      - name: Validate
        run: make -f Ops.mk validate

  # The BUILD_PATHS regex must cover build.yml's paths: filter. If build.yml
  # learns to trigger on a path this does not know about, a PR touching only that
  # path would skip the gate entirely. The sibling repo has a dedicated commit
  # fixing exactly this drift.
  paths-in-sync:
    name: build paths in sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Assert build.yml paths are covered
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys, yaml
          build = yaml.safe_load(open('.github/workflows/build.yml'))
          # yaml parses the `on:` key as the boolean True.
          trigger = build.get('on') or build.get(True)
          paths = trigger['pull_request']['paths']
          covered = {
              'versions.json', 'image-contract.json', 'Containerfiles/**',
              'rootfs/**', 'scripts/**', '.github/workflows/build.yml',
          }
          missing = sorted(set(paths) - covered)
          if missing:
              print(f"error: build.yml triggers on {missing}, which pr-gate does not know about", file=sys.stderr)
              sys.exit(1)
          print("OK: build.yml paths are covered")
          PY

  gate:
    name: pr-gate
    runs-on: ubuntu-latest
    needs: [validate, paths-in-sync]
    if: always()
    steps:
      # The aggregate is the required check. Individual jobs are deliberately NOT
      # made required: a required check that is skipped blocks the PR forever.
      - name: Verdict
        run: |
          set -euo pipefail
          [ "${{ needs.validate.result }}" = success ] || exit 1
          [ "${{ needs.paths-in-sync.result }}" = success ] || exit 1
          echo "pr-gate passed"
